[package]
name = "tests"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["aws-lc-rs"]
ring = ["tuic/ring", "rustls/ring", "server-tuic-rs/ring"]
aws-lc-rs = ["tuic/aws-lc-rs", "dep:aws-lc-rs", "rustls/aws-lc-rs", "server-tuic-rs/aws-lc-rs"]
deplog = ["tracing-test/no-env-filter"]

[dependencies]
# Core dependencies for integration tests
tuic = { package = "tuic-core", path = "../core", default-features = false, features = ["async_marshal", "marshal", "model"] }
server-tuic-rs = { path = "../server-tuic-rs", default-features = false }

# Required dependencies
uuid = { version = "1", features = ["v4", "serde", "std"] }
tokio = { version = "1", features = ["full"] }
json5 = { version = "1.2" }
lexopt = { version = "0.3" }
eyre = { version = "0.6" }
fast-socks5 = { version = "1.0.0" }
rustls = { version = "0.23", default-features = false }
tracing-test = { version = "0.2" }
tracing = "0.1"
serial_test = "4"
aws-lc-rs = { version = "1", default-features = false, optional = true, features = ["prebuilt-nasm"] }
server-client-rs = { git = "https://github.com/xflash-panda/server-client-rs", tag = "v0.1.18" }